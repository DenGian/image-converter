name: Bug report
description: Report a reproducible conversion or interface problem
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not attach sensitive images. Reproduce with a small non-private fixture when possible.
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Conversion
      options: [JPEG, PNG, WebP, AVIF, GIF, BMP, TIFF, HEIC input, ICO output, Interface only]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
