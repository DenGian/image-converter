name: Feature request
description: Suggest a focused, privacy-preserving improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy constraint
      options:
        - label: This can work without uploading user files.
          required: true
