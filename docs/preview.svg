<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Local Lens application preview</title>
  <desc id="desc">A restrained cream image-conversion workspace with coral accents, upload area, file queue, and output settings.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#292720" flood-opacity=".10"/></filter>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e5e3dc"/><rect x="6" y="6" width="6" height="6" fill="#e5e3dc"/><rect x="6" width="6" height="6" fill="#f4f2ec"/><rect y="6" width="6" height="6" fill="#f4f2ec"/></pattern>
  </defs>
  <rect width="1200" height="720" fill="#f3f1eb"/>
  <rect x="55" y="26" width="1090" height="56" fill="none" stroke="#dcdad2" stroke-width="1"/>
  <circle cx="79" cy="54" r="11" fill="none" stroke="#20231f" stroke-width="2"/><circle cx="79" cy="54" r="4" fill="#ea5a35"/>
  <text x="99" y="58" fill="#20231f" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">LOCAL LENS</text>
  <rect x="963" y="40" width="100" height="28" rx="14" fill="#e4f1e9"/><text x="981" y="58" fill="#1e7151" font-family="Arial,sans-serif" font-size="10" font-weight="700">✓ Local processing</text>
  <circle cx="1091" cy="54" r="15" fill="#fbfaf6"/><circle cx="1128" cy="54" r="15" fill="#fbfaf6"/>

  <text x="55" y="127" fill="#ea5a35" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">PRIVATE BY DEFAULT</text>
  <text x="55" y="178" fill="#20231f" font-family="Arial,sans-serif" font-size="51" font-weight="700" letter-spacing="-3">Convert images.</text>
  <text x="55" y="222" fill="#ea5a35" font-family="Georgia,serif" font-size="49" font-style="italic">Keep them yours.</text>
  <text x="672" y="156" fill="#686c65" font-family="Arial,sans-serif" font-size="15">A capable image workshop that runs entirely in your browser.</text>
  <text x="672" y="181" fill="#686c65" font-family="Arial,sans-serif" font-size="15">No uploads, no accounts, no waiting on a server.</text>
  <text x="55" y="252" fill="#20231f" font-family="Arial,sans-serif" font-size="12" font-weight="700">9</text><text x="69" y="252" fill="#686c65" font-family="Arial,sans-serif" font-size="9">useful formats</text>
  <text x="151" y="252" fill="#20231f" font-family="Arial,sans-serif" font-size="12" font-weight="700">0</text><text x="164" y="252" fill="#686c65" font-family="Arial,sans-serif" font-size="9">files uploaded</text>
  <text x="253" y="252" fill="#20231f" font-family="Arial,sans-serif" font-size="12" font-weight="700">100%</text><text x="286" y="252" fill="#686c65" font-family="Arial,sans-serif" font-size="9">in your browser</text>

  <rect x="55" y="282" width="786" height="194" rx="13" fill="#fff" stroke="#bbb8af" stroke-dasharray="5 5" filter="url(#shadow)"/>
  <circle cx="123" cy="359" r="27" fill="#fce9e4"/><path d="M110 365l9-9 8 8 5-5 8 8m-15-20v10m-5-5 5-5 5 5" fill="none" stroke="#ea5a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="351" fill="#20231f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Bring your images</text>
  <text x="172" y="376" fill="#686c65" font-family="Arial,sans-serif" font-size="12">Drop them here, choose files, or paste from your clipboard.</text>
  <rect x="603" y="340" width="111" height="39" rx="7" fill="#ea5a35"/><text x="624" y="364" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Choose images</text>
  <rect x="723" y="340" width="80" height="39" rx="7" fill="#fff" stroke="#dcdad2"/><text x="744" y="364" fill="#20231f" font-family="Arial,sans-serif" font-size="11" font-weight="700">Paste</text>
  <text x="172" y="423" fill="#1e7151" font-family="Arial,sans-serif" font-size="9">✓ Read and converted locally — nothing is uploaded</text>

  <rect x="859" y="282" width="286" height="350" rx="13" fill="#fff" stroke="#dcdad2" filter="url(#shadow)"/>
  <text x="883" y="318" fill="#20231f" font-family="Arial,sans-serif" font-size="14" font-weight="700">☷  Output settings</text>
  <text x="883" y="351" fill="#20231f" font-family="Arial,sans-serif" font-size="10" font-weight="700">Convert to</text>
  <rect x="883" y="362" width="238" height="39" rx="7" fill="#fbfaf6" stroke="#dcdad2"/><text x="897" y="386" fill="#20231f" font-family="Arial,sans-serif" font-size="11">WebP</text><text x="1100" y="386" fill="#686c65" font-family="Arial,sans-serif" font-size="11">⌄</text>
  <text x="883" y="429" fill="#20231f" font-family="Arial,sans-serif" font-size="10" font-weight="700">Quality</text><text x="1107" y="429" fill="#ea5a35" text-anchor="end" font-family="Arial,sans-serif" font-size="10">82</text>
  <rect x="883" y="445" width="238" height="3" rx="2" fill="#dcdad2"/><rect x="883" y="445" width="185" height="3" rx="2" fill="#ea5a35"/><circle cx="1068" cy="446" r="6" fill="#ea5a35"/>
  <line x1="883" y1="481" x2="1121" y2="481" stroke="#dcdad2"/>
  <text x="883" y="512" fill="#20231f" font-family="Arial,sans-serif" font-size="10" font-weight="700">Resize</text><text x="918" y="512" fill="#686c65" font-family="Arial,sans-serif" font-size="9">optional</text>
  <rect x="883" y="523" width="105" height="37" rx="7" fill="#fbfaf6" stroke="#dcdad2"/><text x="896" y="546" fill="#9a9d97" font-family="Arial,sans-serif" font-size="10">Auto</text><text x="1000" y="546" fill="#686c65" font-family="Arial,sans-serif" font-size="12">×</text><rect x="1015" y="523" width="106" height="37" rx="7" fill="#fbfaf6" stroke="#dcdad2"/><text x="1028" y="546" fill="#9a9d97" font-family="Arial,sans-serif" font-size="10">Auto</text>
  <text x="884" y="586" fill="#20231f" font-family="Arial,sans-serif" font-size="10">☑ Preserve aspect ratio</text><text x="884" y="606" fill="#20231f" font-family="Arial,sans-serif" font-size="10">☑ Never upscale</text>

  <text x="55" y="516" fill="#ea5a35" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">YOUR BATCH</text><text x="55" y="543" fill="#20231f" font-family="Arial,sans-serif" font-size="20" font-weight="700">2 images</text>
  <rect x="55" y="561" width="786" height="72" rx="9" fill="#fff" stroke="#dcdad2"/>
  <rect x="67" y="572" width="50" height="50" rx="6" fill="url(#grid)"/><circle cx="92" cy="597" r="16" fill="#ea5a35" opacity=".82"/>
  <text x="132" y="589" fill="#20231f" font-family="Arial,sans-serif" font-size="11" font-weight="700">coastline.jpg</text><text x="132" y="608" fill="#686c65" font-family="Arial,sans-serif" font-size="9">JPEG · 2400 × 1600 · 2.4 MB</text>
  <rect x="701" y="578" width="70" height="22" rx="11" fill="#e4f1e9"/><text x="719" y="593" fill="#1e7151" font-family="Arial,sans-serif" font-size="9" font-weight="700">✓ Complete</text>
  <text x="132" y="624" fill="#686c65" font-family="Arial,sans-serif" font-size="9">2.4 MB → 486 KB   </text><text x="229" y="624" fill="#1e7151" font-family="Arial,sans-serif" font-size="9" font-weight="700">−80%</text>
  <rect x="55" y="644" width="1090" height="54" rx="11" fill="#fff" stroke="#dcdad2" filter="url(#shadow)"/>
  <text x="76" y="666" fill="#20231f" font-family="Arial,sans-serif" font-size="10" font-weight="700">1 ready to convert</text><text x="76" y="683" fill="#686c65" font-family="Arial,sans-serif" font-size="8">Processed sequentially to keep memory use predictable</text>
  <rect x="984" y="652" width="145" height="38" rx="7" fill="#ea5a35"/><text x="1016" y="676" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Convert 1 image</text>
</svg>
